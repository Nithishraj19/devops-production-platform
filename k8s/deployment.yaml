apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-production-platform
spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-production-platform

  template:
    metadata:
      labels:
        app: devops-production-platform

    spec:
      containers:
        - name: devops-production-platform
          image: devops-production-platform:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
